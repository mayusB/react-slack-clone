variables:
- group: Semgrep_Mayowa

jobs:
- job: Semgrep       
  steps:
    - script: |
        python -m pip install --upgrade pip
        pip install semgrep
        semgrep login
        semgrep ci  
      env:
        SEMGREP_APP_TOKEN: $(SEMGREP_APP_TOKEN)
        SEMGREP_REPO_DISPLAY_NAME: monorepo-test--$(repo)    
